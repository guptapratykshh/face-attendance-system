name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: frs
          POSTGRES_PASSWORD: frs
          POSTGRES_DB: frs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check backend scripts
      - name: Pytest (SQLite)
        env:
          FRS_REQUIRE_LIVENESS: "false"
          FRS_ALLOW_PUBLIC_REGISTER: "true"
          FRS_RATE_LIMIT: "false"
        run: pytest -q
      - name: Pytest PostGIS geofence
        env:
          FRS_REQUIRE_LIVENESS: "false"
          FRS_ALLOW_PUBLIC_REGISTER: "true"
          FRS_RATE_LIMIT: "false"
          FRS_DATABASE_URL: postgresql+psycopg://frs:frs@127.0.0.1:5432/frs
          FRS_SECRET_KEY: ci-secret-key-at-least-32-characters-long
          FRS_ADMIN_PASSWORD: admin1234
        run: pytest -q backend/tests/test_postgis_geofence.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
