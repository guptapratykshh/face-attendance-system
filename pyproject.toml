[project]
name = "face-recognition-system"
version = "0.1.0"
description = "FaceNet/ArcFace face verification and identification system with FastAPI backend and React frontend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=2.0.0",
    "pillow>=10.3.0",
    "opencv-python-headless>=4.10.0",
    "onnxruntime>=1.19.0",
    "insightface>=0.7.3",
    "faiss-cpu>=1.8.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5.0.0",
    "datasets>=2.21.0",
    "huggingface-hub>=0.24.0",
    "tqdm>=4.66.0",
    "mediapipe>=0.10.14",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
